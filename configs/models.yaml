logistic_regression:
  C: 0.1
  class_weight: balanced
  max_iter: 1000
  solver: lbfgs
mlp:
  batch_size: 256
  dropout: 0.2
  epochs: 15
  hidden_dims:
  - 64
  - 32
  input_dim: 44
  learning_rate: 0.005
  weight_decay: 1e-4
xgboost:
  colsample_bytree: 0.8
  learning_rate: 0.05
  max_depth: 5
  n_estimators: 150
  random_state: 42
  scale_pos_weight: 7.681
  subsample: 0.8
