features:
  encounter_id:
    classification: "EXCLUDED"
    reason: "Arbitrary administrative identifier. Using it would lead to model memorization."
  patient_nbr:
    classification: "EXCLUDED"
    reason: "Patient identifier. Used strictly for patient-level partitioning and splitting to prevent data leakage."
  weight:
    classification: "EXCLUDED"
    reason: "High missingness (>96%). Imputing would introduce severe noise."
  payer_code:
    classification: "EXCLUDED"
    reason: "Administrative insurance code. Lacks clinical relevance to patient readmission risk."
  discharge_disposition_id:
    classification: "POTENTIAL_LEAKAGE"
    reason: "Contains codes indicating patient expired or went to hospice. Evaluated and filtered prior to training."
  readmitted:
    classification: "TARGET"
    reason: "Label indicating 30-day readmission status."
