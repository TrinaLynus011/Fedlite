numerical_features:
  - "time_in_hospital"
  - "num_lab_procedures"
  - "num_procedures"
  - "num_medications"
  - "number_outpatient"
  - "number_emergency"
  - "number_inpatient"
  - "number_diagnoses"

categorical_features:
  - "race"
  - "gender"
  - "age"
  - "admission_type_id"
  - "admission_source_id"
  - "medical_specialty"
  - "diag_1"
  - "diag_2"
  - "diag_3"
  - "max_glu_serum"
  - "A1Cresult"
  - "metformin"
  - "repaglinide"
  - "nateglinide"
  - "chlorpropamide"
  - "glimepiride"
  - "acetohexamide"
  - "glipizide"
  - "glyburide"
  - "tolbutamide"
  - "pioglitazone"
  - "rosiglitazone"
  - "acarbose"
  - "miglitol"
  - "troglitazone"
  - "tolazamide"
  - "examide"
  - "citoglipton"
  - "insulin"
  - "glyburide-metformin"
  - "glipizide-metformin"
  - "glimepiride-pioglitazone"
  - "metformin-rosiglitazone"
  - "metformin-pioglitazone"
  - "change"
  - "diabetesMed"

excluded_features:
  - "encounter_id"
  - "patient_nbr"
  - "weight"
  - "payer_code"
  - "discharge_disposition_id"  # Excluded after leakage filter applies

imputation:
  numerical: "median"
  categorical: "missing_category"  # creates "missing" category for '?' or nan

scaling: "standard"
categorical_encoding: "target"  # target encoding to avoid high dimensionality from race/medical_specialty/diags
